global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: commerce-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  
  - job_name: outbox-publisher
    static_configs:
      - targets: ["outbox-publisher-worker:9091"]

  - job_name: order_cancelator
    static_configs:
      - targets: ["order-cancelator-worker:9092"]
